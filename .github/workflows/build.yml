name: Build NVStreamNX NRO

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest

    steps:
      - name: Install tools
        run: |
          command -v git >/dev/null && command -v cmake >/dev/null || \
            (apt-get update && apt-get install -y git cmake make)

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Если Borealis не подключён как submodule — клонируем сами
      - name: Fetch Borealis
        run: |
          if [ ! -f library/borealis/library/CMakeLists.txt ]; then
            rm -rf library/borealis
            git clone --recursive --depth 1 https://github.com/xfangfang/borealis.git library/borealis
          fi

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DPLATFORM_SWITCH=ON -DUSE_GLFW=ON

      - name: Build
        run: make -C build NVStreamNX.nro -j$(nproc)

      - name: Upload NRO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NVStreamNX-NRO
          path: build/NVStreamNX.nro
