name: Build Switch NRO

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Switch dependencies
        run: |
          dkp-pacman -Syyu --noconfirm
          dkp-pacman -S --noconfirm switch-tools switch-sdl2 switch-libnx switch-fmt switch-mbedtls switch-curl switch-json-c

      - name: Build Project
        run: |
          make -j$(nproc)

      - name: Upload NRO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NVStreamNX-NRO
          path: "*.nro"
